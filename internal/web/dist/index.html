<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LincMox — Contrôle LED</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-alt: #161b22;
            --bg-elev: #1c2128;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --text-bright: #f0f6fc;
            --accent: #58a6ff;
            --accent-dim: #1f6feb;
            --green: #3fb950;
            --red: #f85149;
            --orange: #f0883e;
            --yellow: #d29922;
            --radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        a { color: var(--accent); text-decoration: none; }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: var(--bg-alt);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header .logo {
            font-family: monospace;
            font-weight: 700;
            color: var(--accent);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        header .conn {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-dim);
            display: inline-block;
        }
        .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .card h2 {
            margin: 0 0 16px;
            font-size: 1.05rem;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2 small { color: var(--text-dim); font-weight: 400; font-size: 0.8rem; }

        .led-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .led-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .led-card .led-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-bright);
        }

        .led-card .led-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .color-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-dot:hover { transform: scale(1.2); }
        .color-dot.active { border-color: var(--text-bright); }
        .color-white { background: #ffffff; }
        .color-red { background: #f85149; }
        .color-orange { background: #f0883e; }

        button {
            background: var(--accent-dim);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }
        button:hover { background: #2458a8; }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        button.ghost:hover { background: var(--bg-elev); }

        button.success { background: var(--green); color: #04170a; }
        button.success:hover { background: #2ea043; }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .row + .row { margin-top: 10px; }

        .spacer { flex: 1; }

        label { font-size: 0.82rem; color: var(--text-dim); }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            min-width: 120px;
        }
        input[type="number"], select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .value-badge {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .swatch {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #000;
        }

        .monitor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .monitor-item:last-child { border-bottom: none; }
        .monitor-item .m-status { font-size: 0.8rem; font-weight: 600; }
        .running { color: var(--green); }
        .stopped { color: var(--text-dim); }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        .toast {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            animation: slideIn 0.2s;
            max-width: 340px;
        }
        .toast.error { border-left-color: var(--red); }
        .toast.success { border-left-color: var(--green); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .status-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .status-line { font-family: monospace; font-size: 0.9rem; }
        .status-line .k { color: var(--text-dim); }
        .status-line .v { color: var(--text-bright); }

        .placeholder { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px 0; }

        @media (max-width: 600px) {
            .main-grid { grid-template-columns: 1fr; padding: 16px; }
            header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">LINCMOX</div>
        <div style="font-size:0.85rem; color: var(--text-dim);">Contrôle LED de la LincStation N1</div>
        <div class="conn">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connexion…</span>
        </div>
    </header>

    <div class="main-grid">
        <!-- Statut -->
        <section class="card">
            <h2><span>▣</span> Statut</h2>
            <div class="status-panel" id="statusPanel">
                <div class="placeholder">Chargement du statut…</div>
            </div>
        </section>

        <!-- LEDs -->
        <section class="card" style="grid-column: span 2;">
            <h2><span>▣</span> LEDs</h2>
            <div class="led-grid" id="ledGrid"></div>
        </section>

        <!-- Strip -->
        <section class="card">
            <h2><span>▣</span> Bandeau LED (Strip)</h2>

            <div class="row">
                <label>Animation</label>
                <select id="stripAnim" style="flex:1;">
                    <option value="off">Off</option>
                    <option value="breath">Breath (respiration)</option>
                    <option value="loop">Loop (boucle)</option>
                </select>
                <button id="btnAnim">Appliquer</button>
            </div>

            <div class="row">
                <label>Luminosité</label>
                <span class="value-badge" id="brightnessVal">128</span>
                <input type="range" id="stripBrightness" min="0" max="255" value="128">
            </div>

            <div class="row">
                <label>Couleur unie</label>
                <div class="swatch" id="colorSwatch"></div>
                <input type="color" id="stripColor" value="#ff0000" style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px; height:34px;">
            </div>

            <div class="row">
                <label>Couleur Loop 1</label>
                <input type="color" id="loop1Color" value="#00ff00">
            </div>
            <div class="row">
                <label>Couleur Loop 2</label>
                <input type="color" id="loop2Color" value="#0000ff">
            </div>

            <div class="row">
                <button id="btnStripApply" class="success">Appliquer</button>
                <button id="btnStripReset" class="ghost" style="margin-left:auto;">Réinitialiser</button>
            </div>
        </section>

        <!-- Moniteurs -->
        <section class="card">
            <h2><span>▣</span> Moniteurs</h2>

            <div class="monitor-item">
                <div>
                    <div style="font-size:0.9rem;">Réseau</div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">Blink quand le trafic dépasse le seuil</div>
                </div>
                <span class="m-status stopped" id="netMonitorStatus">Arrêté</span>
            </div>

            <div class="row">
                <label>Interface</label>
                <input type="text" id="netIface" value="eth0" style="flex:1;">
            </div>
            <div class="row">
                <label>Intervalle (ms)</label>
                <input type="number" id="netInterval" value="500" min="50" style="flex:1;">
            </div>
            <div class="row">
                <label>Seuil (octets)</label>
                <input type="number" id="netThreshold" value="1024" min="0" style="flex:1;">
            </div>
            <div class="row">
                <button id="btnNetEnable" class="success">Démarrer</button>
                <button id="btnNetDisable" class="ghost">Arrêter</button>
            </div>
        </section>

        <!-- Réinitialisation -->
        <section class="card">
            <h2><span>⎌</span> Réinitialisation</h2>
            <p style="font-size:0.85rem; color:var(--text-dim);">Réinitialise les LEDs et/ou le bandeau LED à leur état d'origine.</p>
            <div class="row">
                <button id="btnResetLeds" class="ghost">LEDs seulement</button>
                <button id="btnResetStrip" class="ghost">Strip seulement</button>
            </div>
            <div class="row">
                <button id="btnResetFull" style="background:var(--red); flex:1;">Réinitialisation complète</button>
            </div>
        </section>
    </div>

    <div class="toast-container" id="toasts"></div>

    <script>
        const API = window.location.origin;

        const LEDS = [
            { id: 'power',   name: 'Power' },
            { id: 'sata1',   name: 'SATA 1' },
            { id: 'sata2',   name: 'SATA 2' },
            { id: 'nvme1',   name: 'NVMe 1' },
            { id: 'nvme2',   name: 'NVMe 2' },
            { id: 'nvme3',   name: 'NVMe 3' },
            { id: 'nvme4',   name: 'NVMe 4' },
            { id: 'network', name: 'Network' },
        ];

        const COLORS = [
            { id: 'white',  label: 'Blanc',   cls: 'color-white'  },
            { id: 'red',    label: 'Rouge',   cls: 'color-red'    },
            { id: 'orange', label: 'Orange',  cls: 'color-orange' },
        ];

        let selectedColors = {};
        LEDS.forEach(l => selectedColors[l.id] = 'white');

        // ---------- Helpers ----------
        function $ (id) { return document.getElementById(id); }

        async function api(path, options = {}) {
            if (options.body) {
                options.headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
                options.body = JSON.stringify(options.body);
            }
            const res = await fetch(API + path, options);
            if (!res.ok) {
                let msg = res.statusText;
                try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
                throw new Error(msg);
            }
            try { return await res.json(); } catch (e) { return null; }
        }

        function toast(msg, type = '') {
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            $('toasts').appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ---------- Led control ----------
        function buildLedGrid() {
            const grid = $('ledGrid');
            grid.innerHTML = '';
            LEDS.forEach(led => {
                const card = document.createElement('div');
                card.className = 'led-card';
                card.innerHTML = `
                    <div class="led-name">${led.name}</div>
                    <div class="color-dots">
                        ${COLORS.map(c => `<span class="color-dot ${c.cls}" data-color="${c.id}" title="${c.label}"></span>`).join('')}
                    </div>
                    <div class="led-actions">
                        <button class="ghost" data-action="on">On</button>
                        <button class="ghost" data-action="off">Off</button>
                        <button class="ghost" data-action="blink">Blink</button>
                    </div>
                `;
                grid.appendChild(card);

                card.querySelectorAll('.color-dot').forEach(dot => {
                    dot.addEventListener('click', () => {
                        selectedColors[led.id] = dot.dataset.color;
                        card.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                        dot.classList.add('active');
                    });
                });
                card.querySelector('.color-dots .color-white').classList.add('active');

                card.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const action = btn.dataset.action;
                        const color = selectedColors[led.id];
                        btn.disabled = true;
                        try {
                            if (action === 'blink') {
                                await api(`/api/v1/led/${led.id}/blink`, { method: 'POST', body: { blink: true } });
                            } else {
                                await api(`/api/v1/led/${led.id}/${action}`, { method: 'POST', body: { color } });
                            }
                            toast(`${led.name}: ${action === 'on' ? 'allumée' : action === 'off' ? 'éteinte' : 'clignotement'}`, 'success');
                        } catch (e) {
                            toast(`Erreur ${led.name}: ${e.message}`, 'error');
                        } finally {
                            btn.disabled = false;
                        }
                    });
                });
            });
        }

        // ---------- Strip ----------
        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        function updateColorSwatch() {
            $('colorSwatch').style.background = $('stripColor').value;
        }

        $('stripColor').addEventListener('input', updateColorSwatch);
        updateColorSwatch();

        $('stripBrightness').addEventListener('input', () => {
            $('brightnessVal').textContent = $('stripBrightness').value;
        });

        $('btnAnim').addEventListener('click', async () => {
            try {
                await api('/api/v1/strip/animation', { method: 'POST', body: { mode: $('stripAnim').value } });
                toast('Animation appliquée', 'success');
            } catch (e) { toast('Erreur: ' + e.message, 'error'); }
        });

        $('btnStripApply').addEventListener('click', async () => {
            try {
                const col = hexToRgb($('stripColor').value);
                const loop1 = hexToRgb($('loop1Color').value);
                const loop2 = hexToRgb($('loop2Color').value);
                await api('/api/v1/strip/color', { method: 'POST', body: col });
                await api('/api/v1/strip/loop/1/color', { method: 'POST', body: loop1 });
                await api('/api/v1/strip/loop/2/color', { method: 'POST', body: loop2 });
                await api('/api/v1/strip/brightness', { method: 'POST', body: { value: parseInt($('stripBrightness').value) } });
                $('brightnessVal').textContent = $('stripBrightness').value;
                toast('Strip appliqué', 'success');
            } catch (e) { toast('Erreur: ' + e.message, 'error'); }
        });

        $('btnStripReset').addEventListener('click', async () => {
            try {
                await api('/api/v1/reset', { method: 'POST', body: { mode: 'strip' } });
                toast('Strip réinitialisé', 'success');
            } catch (e) { toast('Erreur: ' + e.message, 'error'); }
        });

        // ---------- Monitors ----------
        async function refreshMonitors() {
            try {
                const data = await api('/api/v1/monitors');
                const running = (data && data.running) || [];
                const netRunning = running.includes('network');
                const el = $('netMonitorStatus');
                el.textContent = netRunning ? 'Actif' : 'Arrêté';
                el.className = 'm-status ' + (netRunning ? 'running' : 'stopped');
            } catch (e) { /* ignore */ }
        }

        $('btnNetEnable').addEventListener('click', async () => {
            try {
                await api('/api/v1/monitors/network/enable', { method: 'POST', body: {
                    iface: $('netIface').value || 'eth0',
                    interval_ms: parseInt($('netInterval').value) || 500,
                    threshold_bytes: parseInt($('netThreshold').value) || 1024,
                }});
                toast('Moniteur réseau démarré', 'success');
                refreshMonitors();
            } catch (e) { toast('Erreur: ' + e.message, 'error'); }
        });

        $('btnNetDisable').addEventListener('click', async () => {
            try {
                await api('/api/v1/monitors/network/disable', { method: 'POST' });
                toast('Moniteur réseau arrêté', 'success');
                refreshMonitors();
            } catch (e) { toast('Erreur: ' + e.message, 'error'); }
        });

        // ---------- Resets ----------
        $('btnResetLeds').addEventListener('click', async () => {
            await doReset('leds');
        });
        $('btnResetStrip').addEventListener('click', async () => {
            await doReset('strip');
        });
        $('btnResetFull').addEventListener('click', async () => {
            await doReset('full');
        });

        async function doReset(mode) {
            try {
                await api('/api/v1/reset', { method: 'POST', body: { mode } });
                toast('Réinitialisation (' + mode + ') effectuée', 'success');
            } catch (e) { toast('Erreur: ' + e.message, 'error'); }
        }

        // ---------- Status ----------
        async function refreshStatus() {
            try {
                const data = await api('/api/v1/status');
                $('statusDot').className = 'dot ok';
                $('statusText').textContent = 'Connecté';
                const panel = $('statusPanel');
                panel.innerHTML = `
                    <div class="status-line"><span class="k">Statut :</span> <span class="v">${data.status}</span></div>
                    <div class="status-line"><span class="k">Appareil :</span> <span class="v">${data.device}</span></div>
                    <div class="status-line"><span class="k">Moniteurs actifs :</span> <span class="v">${(data.monitors && data.monitors.running) ? data.monitors.running.join(', ') || 'aucun' : 'aucun'}</span></div>
                `;
                return data;
            } catch (e) {
                $('statusDot').className = 'dot err';
                $('statusText').textContent = 'Déconnecté';
                $('statusPanel').innerHTML = `<div class="placeholder">Impossible de joindre l'API : ${e.message}</div>`;
                return null;
            }
        }

        // ---------- Init ----------
        buildLedGrid();
        refreshStatus();
        refreshMonitors();
        setInterval(refreshStatus, 5000);
        setInterval(refreshMonitors, 5000);
    </script>
</body>
</html>
